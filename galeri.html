<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Kegiatan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background-color: #28a745;
            color: white;
            padding: 20px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        /* Layout Grid Galeri */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .gallery-item {
            text-align: center;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 8px;
        }

        .gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
        }

        .gallery p {
            font-size: 14px;
            color: #555;
            margin-top: 8px;
            font-weight: bold;
        }

        .btn-kembali {
            display: inline-block;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn-kembali:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <h1>🖼️ Galeri Kegiatan</h1>
            <p>Dokumentasi Kegiatan Kelas & Kelompok</p>
        </header>

        <div class="card">
            <div class="gallery">
                <div class="gallery-item">
                    <img src="https://via.placeholder.com/300x200" alt="Kerja Kelompok">
                    <p>Kerja Kelompok</p>
                </div>
                <div class="gallery-item">
                    <img src="https://via.placeholder.com/300x200" alt="Upacara">
                    <p>Kegiatan Upacara</p>
                </div>
                <div class="gallery-item">
                    <img src="https://via.placeholder.com/300x200" alt="Olahraga">
                    <p>Hari Olahraga</p>
                </div>
                <div class="gallery-item">
                    <img src="https://via.placeholder.com/300x200" alt="Presentasi">
                    <p>Presentasi Kelas</p>
                </div>
            </div>
        </div>

        <!-- Tombol Kembali ke Beranda -->
        <div style="text-align: center;">
            <a href="index.html" class="btn-kembali">⬅️ Kembali ke Halaman Utama</a>
        </div>

    </div>

</body>
</html>
